version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: ai-analytics-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai-analytics-saas

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-analytics-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ai-analytics-saas
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongodb
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-analytics-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
